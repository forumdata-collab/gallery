<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖片庫 Gallery</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
background:radial-gradient(1200px 800px at 50% -10%,#1a1a2e 0%,#141428 55%,#0d0d1e 100%);color:#fff;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
.header h1{font-size:18px;font-weight:800;background:linear-gradient(90deg,#ffd700,#ff8c00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
.header .count{font-size:13px;color:rgba(255,255,255,.55);font-weight:600}
.container{max-width:960px;margin:0 auto;padding:18px 14px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{border-radius:12px;overflow:hidden;position:relative;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);aspect-ratio:4/3;cursor:pointer;transition:all .25s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,215,0,.5);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .name{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:80px 20px;color:rgba(255,255,255,.4);font-size:15px}
.empty .big{font-size:48px;display:block;margin-bottom:12px}
/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.lightbox .lb-name{color:#fff;font-size:14px;margin-top:14px;word-break:break-all;text-align:center;max-width:90vw}
.lb-actions{display:flex;gap:12px;margin-top:14px}
.lb-btn{background:linear-gradient(135deg,#ff5e5b,#d63031);color:#fff;border:none;padding:12px 26px;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.lb-btn.ghost{background:rgba(255,255,255,.1);color:#ddd}
.lb-close{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.1);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;z-index:10}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);border:none;color:#fff;width:52px;height:52px;border-radius:50%;font-size:24px;cursor:pointer;z-index:10}
.lb-prev{left:14px}.lb-next{right:14px}
.lb-nav:disabled{opacity:.25;cursor:default}
.loading{text-align:center;padding:60px;color:rgba(255,255,255,.5)}
.loading .spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:#ffd700;border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{text-align:center;padding:60px 20px;color:rgba(255,255,255,.65)}
.error-box .big{font-size:42px;display:block;margin-bottom:12px}
.error-box #errMsg{font-size:15px;margin-bottom:20px}
.retry-btn{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#222;border:none;padding:12px 30px;border-radius:24px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.retry-btn:active{transform:scale(.96)}
footer.app-footer{text-align:center;padding:20px;color:rgba(255,255,255,.35);font-size:11px}
@media(max-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="header">
  <h1>📷 圖片庫</h1>
  <span class="count" id="count">載入中…</span>
</div>
<div class="container">
  <div class="loading" id="loading"><div class="spin"></div>載入中…</div>
  <div class="grid" id="grid" style="display:none"></div>
  <div class="empty" id="empty" style="display:none"><span class="big">📭</span>暫時冇圖片</div>
  <div class="error-box" id="errorBox" style="display:none">
    <span class="big">⚠️</span>
    <div id="errMsg">載入失敗</div>
    <button class="retry-btn" onclick="load()">🔄 重試</button>
  </div>
</div>

<!-- lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLB()">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev" onclick="navLB(-1)">‹</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-name" id="lbName"></div>
  <div class="lb-actions">
    <a class="lb-btn" id="lbDownload" href="#" download>⬇ 下載原圖</a>
    <button class="lb-btn ghost" onclick="closeLB()">關閉</button>
  </div>
  <button class="lb-nav lb-next" id="lbNext" onclick="navLB(1)">›</button>
</div>

<footer class="app-footer">圖片存放於 Cloudflare R2 · 自動同步自 Google Drive · <span id="ver"></span></footer>

<script>
const BASE = 'https://img.hermesagent.de5.net';
// manifest key 已含 'gallery/' 前綴，所以圖片 URL = BASE + '/' + key
const VER = 'v6';
document.getElementById('ver').textContent = VER + ' · ' + new Date().toISOString().slice(0,10);
let items = [];
let idx = 0;

async function load(){
  const loading = document.getElementById('loading');
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const errBox = document.getElementById('errorBox');
  loading.style.display = 'block';
  grid.style.display = 'none';
  empty.style.display = 'none';
  errBox.style.display = 'none';
  try{
    // 8 秒 timeout，唔好永遠「載入中」
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    // 先試同源 manifest（GitHub Pages — 公司網絡都通），失敗先用 R2
    let d = null;
    try{
      const r = await fetch('./manifest.json?t=' + Date.now(), {signal: ctrl.signal});
      if(r.ok) d = await r.json();
    }catch(e){ /* fallback below */ }
    if(!d){
      const r2 = await fetch(BASE + '/gallery/manifest.json?t=' + Date.now(), {signal: ctrl.signal});
      if(!r2.ok) throw new Error('HTTP ' + r2.status);
      d = await r2.json();
    }
    clearTimeout(timer);
    items = d.items || [];
  }catch(e){
    // fetch 失敗 ≠ 冇圖 — 顯示錯誤 + 重試
    loading.style.display = 'none';
    errBox.style.display = 'block';
    document.getElementById('errMsg').textContent =
      '載入失敗（' + (e.name === 'AbortError' ? '逾時' : '網絡') + '）— 公司網絡可能封鎖圖片伺服器，請用手機或其他網絡開啟';
    document.getElementById('count').textContent = '—';
    return;
  }
  loading.style.display = 'none';
  if(!items.length){
    empty.style.display = 'block';
    document.getElementById('count').textContent = '0 張';
    return;
  }
  grid.style.display = 'grid';
  document.getElementById('count').textContent = items.length + ' 張';
  items.forEach((it, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    // 縮圖：先試同源（GitHub Pages — 公司網絡都通），失敗 fallback R2
    const thumb = document.createElement('img');
    thumb.alt = it.name;
    thumb.loading = 'lazy';
    thumb.decoding = 'async';
    thumb.src = './thumbs/' + it.id + '.jpg?t=' + encodeURIComponent(it.modified);
    thumb.onerror = () => {
      if(thumb.dataset.fb){ card.style.opacity = .3; return; }
      thumb.dataset.fb = '1';
      thumb.src = BASE + '/' + it.thumb + '?t=' + encodeURIComponent(it.modified);
    };
    card.appendChild(thumb);
    const nameDiv = document.createElement('div');
    nameDiv.className = 'name';
    nameDiv.textContent = it.name;
    card.appendChild(nameDiv);
    card.onclick = () => openLB(i);
    grid.appendChild(card);
  });
}

function openLB(i){
  idx = i;
  const it = items[i];
  const img = document.getElementById('lbImg');
  // 大圖：先試同源原圖（公司網絡通、清晰），fallback 同源縮圖 → R2 原圖
  img.dataset.fb = '';
  img.src = './full/' + it.id + (it.ext || '.jpg') + '?t=' + encodeURIComponent(it.modified);
  img.onerror = () => {
    if(img.dataset.fb === 'thumb'){ img.src = BASE + '/' + it.full + '?t=' + encodeURIComponent(it.modified); return; }
    if(img.dataset.fb){ return; }
    img.dataset.fb = 'thumb';
    img.src = './thumbs/' + it.id + '.jpg?t=' + encodeURIComponent(it.modified);
  };
  document.getElementById('lbName').textContent = it.name;
  // 下載：同源原圖（公司網絡都下載到）+ download 屬性強制下載
  const dl = document.getElementById('lbDownload');
  dl.href = './full/' + it.id + (it.ext || '.jpg') + '?download=1&t=' + encodeURIComponent(it.modified);
  dl.setAttribute('download', it.name);
  updateNav();
  document.getElementById('lightbox').classList.add('show');
}
function closeLB(){
  document.getElementById('lightbox').classList.remove('show');
}
function navLB(dir){
  const n = idx + dir;
  if(n < 0 || n >= items.length) return;
  openLB(n);
}
function updateNav(){
  document.getElementById('lbPrev').disabled = idx <= 0;
  document.getElementById('lbNext').disabled = idx >= items.length - 1;
}
document.addEventListener('keydown', e => {
  if(document.getElementById('lightbox').classList.contains('show')){
    if(e.key === 'Escape') closeLB();
    if(e.key === 'ArrowLeft') navLB(-1);
    if(e.key === 'ArrowRight') navLB(1);
  }
});
load();
</script>
</body>
</html>
