name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write        # 刪除重複／輪詢 github-pages artifact

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # deploy-pages 要求「恰好一個」叫 github-pages 嘅 artifact。
      # 重跑 job 會再上傳同名 artifact，多過一個就永遠 fail → 上傳前先清。
      - name: Clear stale github-pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const run_id = context.runId
            const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id, per_page: 100,
            })
            const dup = arts.filter((a) => a.name === 'github-pages')
            core.info(`existing github-pages artifacts: ${dup.length}`)
            for (const a of dup) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id })
              core.info(`deleted artifact ${a.id} (${a.size_in_bytes} bytes)`)
            }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      # 上載完成同 artifacts API 見到之間有幾秒 eventual-consistency 延遲，
      # deploy-pages 太早查就會見到 0 個（實測 2026-11-16 兩次都係咁）。
      # 所以輪詢到見到為止，順手清走多出嚟嘅同名 artifact。
      - name: Wait for github-pages artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const run_id = context.runId
            const deadline = Date.now() + 120000
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
            while (Date.now() < deadline) {
              const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id, per_page: 100,
              })
              const gh = arts.filter((a) => a.name === 'github-pages')
              if (gh.length > 1) {
                for (const a of gh.slice(0, -1)) {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id })
                  core.info(`removed duplicate artifact ${a.id}`)
                }
              }
              if (gh.length >= 1) {
                core.info(`github-pages artifact ready (${gh.length}, ${gh[gh.length - 1].size_in_bytes} bytes)`)
                // deploy-pages@v4 查嘅唔係 REST，而係 Actions Results（twirp）artifact service，
                // 兩個 backend 各自 eventual-consistent。實測 REST 已經見到 8.1MB artifact，
                // 0.35 秒後 deploy-pages 仍然報 Found 0 artifact(s) → 要等 index 追上。
                core.info('settling 20s so the Actions Results artifact index catches up…')
                await sleep(20000)
                return
              }
              core.info('waiting for github-pages artifact to register…')
              await sleep(5000)
            }
            core.setFailed('github-pages artifact did not register within 120s')
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy to GitHub Pages (retry once)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Fail if both deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: |
          echo "deploy-pages failed twice — see the errors above" >&2
          exit 1
