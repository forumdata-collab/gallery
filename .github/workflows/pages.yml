name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write        # 需要刪除本 run 嘅重複 github-pages artifact

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # deploy-pages 要求「恰好一個」叫 github-pages 嘅 artifact。
      # 重跑 job 會再上傳一個同名 artifact，多過一個就永遠 fail（Multiple artifacts named ...）。
      # 所以上傳前先刪清本 run 嘅同名 artifact，保證之後只有一個。
      - name: Clear stale github-pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const run_id = context.runId
            const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id, per_page: 100,
            })
            const dup = arts.filter((a) => a.name === 'github-pages')
            core.info(`existing github-pages artifacts: ${dup.length}`)
            for (const a of dup) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id })
              core.info(`deleted artifact ${a.id} (${a.size_in_bytes} bytes)`)
            }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
